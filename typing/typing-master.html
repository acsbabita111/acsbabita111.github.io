<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Typing Master Pro UI</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #c8f7a1, #eaffd0);
}

.wrapper {
  max-width: 430px;
  margin: auto;
  border: 5px solid #8a6fd1;
  border-radius: 20px;
  overflow: hidden;
}

/* Layout */
.main {
  display: flex;
}

/* LEFT SIDE */
.left {
  width: 70%;
  padding: 10px;
  background: #f9fff0;
}

.text-display {
  font-size: 14px;
  line-height: 1.6;
  border-bottom: 1px solid #ccc;
  padding-bottom: 10px;
}

.correct { color: green; }
.wrong { color: red; }

.input-line {
  margin-top: 10px;
  font-size: 16px;
  color: green;
}

/* RIGHT PANEL */
.right {
  width: 30%;
  background: linear-gradient(#d6f8a7, #c3f08c);
  padding: 10px;
  text-align: center;
}

.panel-box {
  margin-bottom: 20px;
}

.progress-bar {
  height: 8px;
  background: #ccc;
  margin: 5px 0;
}

.progress-fill {
  height: 8px;
  background: #4caf50;
  width: 40%;
}

button {
  width: 100%;
  padding: 8px;
  margin-top: 5px;
  border: none;
  background: #eee;
}

/* KEYBOARD */
.keyboard {
  padding: 10px;
  background: #eef;
}

.key-row {
  display: flex;
  justify-content: center;
}

.key {
  margin: 2px;
  padding: 8px;
  border-radius: 5px;
  font-size: 12px;
  min-width: 20px;
  text-align: center;
}

/* Colors like image */
.c1 { background:#d1c4e9; }
.c2 { background:#b2dfdb; }
.c3 { background:#ffe082; }
.c4 { background:#c5e1a5; }
.c5 { background:#bbdefb; }

.active { border: 2px solid red; }

</style>
</head>

<body>

<div class="wrapper">

<div class="main">

<!-- LEFT -->
<div class="left">
<div class="text-display" id="textDisplay"></div>
<div class="input-line" id="inputLine"></div>
</div>

<!-- RIGHT -->
<div class="right">

<div class="panel-box">
<b>Test Time</b><br>10 Minutes
</div>

<div class="panel-box">
<b>Your Progress</b>
<div class="progress-bar">
<div class="progress-fill" id="progressFill"></div>
</div>
</div>

<div class="panel-box">
<b>Time</b><br>
<span id="timer">00:00</span>
</div>

<button onclick="nextLesson()">Next</button>
<button>Cancel</button>

</div>

</div>

<!-- KEYBOARD -->
<div class="keyboard" id="keyboard"></div>

</div>

<script>

/* LESSONS */
const lessons = [
"Somewhere below the clouds there is an island",
"In the south of this island there is a city",
"Typing practice improves speed and accuracy",
"Never look at keyboard focus on screen",
"Practice daily to improve typing speed"
];

let current = 0;
let startTime;

/* KEYBOARD */
const keys = [
["q","w","e","r","t","y","u","i","o","p"],
["a","s","d","f","g","h","j","k","l"],
["z","x","c","v","b","n","m"]
];

function renderKeyboard() {
  let html = "";
  keys.forEach((row,i) => {
    html += `<div class="key-row">`;
    row.forEach((k,j) => {
      let color = "c" + ((j%5)+1);
      html += `<div class="key ${color}" id="k-${k}">${k}</div>`;
    });
    html += `</div>`;
  });
  document.getElementById("keyboard").innerHTML = html;
}

/* LOAD */
function loadLesson() {
  startTime = new Date();
  updateDisplay("");
}

/* DISPLAY */
function updateDisplay(typed) {
  let target = lessons[current];
  let html = "";

  for (let i = 0; i < target.length; i++) {
    if (i < typed.length) {
      if (typed[i] === target[i]) {
        html += `<span class="correct">${target[i]}</span>`;
      } else {
        html += `<span class="wrong">${target[i]}</span>`;
      }
    } else {
      html += target[i];
    }
  }

  document.getElementById("textDisplay").innerHTML = html;
  document.getElementById("inputLine").innerText = typed;

  let progress = (typed.length / target.length) * 100;
  document.getElementById("progressFill").style.width = progress + "%";
}

/* INPUT */
document.addEventListener("keydown", (e) => {

  if (!startTime) loadLesson();

  let typed = document.getElementById("inputLine").innerText;

  if (e.key === "Backspace") {
    typed = typed.slice(0,-1);
  } else if (e.key.length === 1) {
    typed += e.key;
  }

  updateDisplay(typed);

  document.querySelectorAll(".key").forEach(k => k.classList.remove("active"));
  let key = document.getElementById("k-"+e.key.toLowerCase());
  if (key) key.classList.add("active");

  let time = (new Date() - startTime)/1000;
  document.getElementById("timer").innerText =
    "00:" + (time<10 ? "0":"") + Math.floor(time);

});

/* NEXT */
function nextLesson() {
  if (current < lessons.length-1) {
    current++;
    loadLesson();
  } else {
    alert("Completed 🎉");
  }
}

renderKeyboard();
loadLesson();

</script>

</body>
</html>
