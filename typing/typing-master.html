<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Typing Master</title>

<style>
body{
margin:0;
font-family:Arial;
background:linear-gradient(to right,orange,green);
}

/* MAIN */
.wrapper{
width:100vw;
height:100vh;
display:flex;
flex-direction:column;
}

/* HEADER */
.header{
text-align:center;
padding:8px;
background:#ffb74d;
font-weight:bold;
}

/* CONTENT */
.content{
flex:1;
display:flex;
}

/* LEFT PANEL */
.left{
width:220px;
background:linear-gradient(#ffe0b2,#a5d6a7);
padding:10px;
display:flex;
flex-direction:column;
justify-content:space-between;
}

.box{
margin-bottom:10px;
font-size:14px;
}

/* GRAPH */
.graph{
display:flex;
align-items:flex-end;
height:100px;
gap:4px;
}

.bar{
width:10px;
background:linear-gradient(orange,green);
}

/* BUTTON */
button{
padding:10px;
margin-top:5px;
border:none;
background:#ffb74d;
font-size:14px;
}

/* RIGHT SIDE */
.right{
flex:1;
padding:15px;
display:flex;
flex-direction:column;
justify-content:flex-start;
}

/* TEXT */
.text{
font-size:18px;
line-height:1.5;
}

.correct{color:green;}
.wrong{color:red;}
.current{background:lightblue;}

/* INPUT */
.input{
margin-top:15px;
font-size:20px;
color:green;
border-top:1px solid #aaa;
padding-top:10px;
min-height:40px;
}

/* KEYBOARD */
.keyboard{
height:200px;
background:#e8f5e9;
padding:10px;
}

.row{
display:flex;
justify-content:center;
}

.key{
margin:3px;
padding:10px;
border-radius:6px;
min-width:40px;
text-align:center;
font-size:14px;
}

/* COLORS */
.c1{background:#d1c4e9;}
.c2{background:#b2dfdb;}
.c3{background:#ffe082;}
.c4{background:#c5e1a5;}
.c5{background:#bbdefb;}

.active{border:3px solid red;}

</style>
</head>

<body>

<div class="wrapper">

<div class="header">
FREEDOM FIGHTER DIGITAL TYPING COURSE
</div>

<div class="content">

<!-- LEFT -->
<div class="left">

<div>
<div class="box"><b>Test Time</b><br>10 Minutes</div>

<div class="box"><b>Your Progress</b></div>

<div class="graph" id="graph"></div>

<div class="box"><b>Time</b><br><span id="time">00:00</span></div>
</div>

<div>
<button onclick="next()">Next</button>
<button>Cancel</button>
</div>

</div>

<!-- RIGHT -->
<div class="right">

<div class="text" id="text"></div>

<div class="input" id="input"></div>

</div>

</div>

<!-- KEYBOARD -->
<div class="keyboard" id="keyboard"></div>

</div>

<script>

let lesson="Somewhere below the clouds there is an island called the United Kingdom.";
let words=lesson.split(" ");
let typed="";
let start=new Date();

/* TEXT RENDER */
function renderText(){
let html="";
let index=0;

words.forEach((word,i)=>{
let len=word.length;

if(typed.length >= index+len){
html+=`<span class="correct">${word}</span> `;
}
else if(typed.length > index){
let part=typed.slice(index,index+len);
let wordHtml="";

for(let j=0;j<word.length;j++){
if(part[j]===word[j]){
wordHtml+=`<span class="correct">${word[j]}</span>`;
}else{
wordHtml+=`<span class="wrong">${word[j]}</span>`;
}
}

html+=wordHtml+" ";
}
else{
html+=`<span class="current">${word}</span> `;
}

index+=len+1;
});

document.getElementById("text").innerHTML=html;
document.getElementById("input").innerText=typed;
}

/* KEYBOARD */
const keys=[
["q","w","e","r","t","y","u","i","o","p"],
["a","s","d","f","g","h","j","k","l"],
["z","x","c","v","b","n","m"]
];

function keyboard(){
let html="";
keys.forEach((r,i)=>{
html+=`<div class="row">`;
r.forEach((k,j)=>{
html+=`<div class="key c${(j%5)+1}" id="k-${k}">${k}</div>`;
});
html+=`</div>`;
});
document.getElementById("keyboard").innerHTML=html;
}

/* GRAPH */
function graph(){
let html="";
for(let i=1;i<=10;i++){
html+=`<div class="bar" style="height:${i*8}px"></div>`;
}
document.getElementById("graph").innerHTML=html;
}

/* INPUT */
document.addEventListener("keydown",(e)=>{
if(e.key==="Backspace"){
typed=typed.slice(0,-1);
}
else if(e.key.length===1){
typed+=e.key;
}

renderText();

document.querySelectorAll(".key").forEach(k=>k.classList.remove("active"));
let key=document.getElementById("k-"+e.key.toLowerCase());
if(key) key.classList.add("active");

let t=(new Date()-start)/1000;
document.getElementById("time").innerText="00:"+Math.floor(t);
});

/* INIT */
keyboard();
graph();
renderText();

function next(){
alert("Next Lesson");
}

</script>

</body>
</html>
