<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Typing Course</title>

<style>
body {
  margin:0;
  font-family: Arial;
  background: linear-gradient(orange, green);
}

/* WRAPPER */
.wrapper {
  max-width:430px;
  margin:auto;
  border-radius:15px;
  overflow:hidden;
  background:#fff3e0;
}

/* HEADER */
.header {
  text-align:center;
  font-size:12px;
  padding:6px;
  background:#ffcc80;
  font-weight:bold;
}

/* MAIN */
.main {
  display:flex;
}

/* LEFT PANEL */
.left {
  width:30%;
  background: linear-gradient(#ffe0b2, #c8e6c9);
  padding:8px;
  text-align:center;
}

.box {
  margin-bottom:15px;
  font-size:11px;
}

.progress-bars {
  display:flex;
  align-items:flex-end;
  height:60px;
  gap:2px;
}

.bar {
  width:6px;
  background:linear-gradient(orange,green);
}

/* RIGHT */
.right {
  width:70%;
  padding:8px;
}

/* TEXT */
.text {
  font-size:13px;
  line-height:1.4;
}

.correct {color:green;}
.wrong {color:red;}

.input {
  margin-top:8px;
  font-size:14px;
}

/* BUTTON */
button {
  width:100%;
  padding:6px;
  margin-top:5px;
  border:none;
  background:#ffb74d;
}

/* KEYBOARD */
.keyboard {
  padding:5px;
  background:#e8f5e9;
}

.row {
  display:flex;
  justify-content:center;
}

.key {
  margin:2px;
  padding:6px;
  font-size:10px;
  border-radius:5px;
  min-width:18px;
  text-align:center;
}

/* COLOR KEYS */
.c1{background:#d1c4e9;}
.c2{background:#b2dfdb;}
.c3{background:#ffe082;}
.c4{background:#c5e1a5;}
.c5{background:#bbdefb;}

.active{border:2px solid red;}

</style>
</head>

<body>

<div class="wrapper">

<div class="header">
FREEDOM FIGHTER DIGITAL TYPING COURSE
</div>

<div class="main">

<!-- LEFT -->
<div class="left">

<div class="box">
<b>Test Time</b><br>10 Minutes
</div>

<div class="box">
<b>Your Progress</b>
<div class="progress-bars" id="bars"></div>
</div>

<div class="box">
<b>Time</b><br>
<span id="time">00:00</span>
</div>

<button onclick="next()">Next</button>
<button>Cancel</button>

</div>

<!-- RIGHT -->
<div class="right">

<div class="text" id="text"></div>

<div class="input" id="input"></div>

</div>

</div>

<!-- KEYBOARD -->
<div class="keyboard" id="keyboard"></div>

</div>

<script>

let lesson = "Somewhere below the clouds there is an island called the United Kingdom.";
let typed = "";
let start = new Date();

/* TEXT RENDER */
function renderText(){
  let html="";
  for(let i=0;i<lesson.length;i++){
    if(i<typed.length){
      if(typed[i]===lesson[i]){
        html+=`<span class="correct">${lesson[i]}</span>`;
      }else{
        html+=`<span class="wrong">${lesson[i]}</span>`;
      }
    }else{
      html+=lesson[i];
    }
  }
  document.getElementById("text").innerHTML=html;
  document.getElementById("input").innerText=typed;
}

/* KEYBOARD */
const keys=[
["q","w","e","r","t","y","u","i","o","p"],
["a","s","d","f","g","h","j","k","l"],
["z","x","c","v","b","n","m"]
];

function renderKeyboard(){
  let html="";
  keys.forEach((r,i)=>{
    html+=`<div class="row">`;
    r.forEach((k,j)=>{
      html+=`<div class="key c${(j%5)+1}" id="k-${k}">${k}</div>`;
    });
    html+=`</div>`;
  });
  document.getElementById("keyboard").innerHTML=html;
}

/* PROGRESS GRAPH */
function renderBars(){
  let html="";
  for(let i=1;i<=10;i++){
    html+=`<div class="bar" style="height:${i*5}px"></div>`;
  }
  document.getElementById("bars").innerHTML=html;
}

/* INPUT */
document.addEventListener("keydown",(e)=>{
  if(e.key==="Backspace"){
    typed=typed.slice(0,-1);
  }else if(e.key.length===1){
    typed+=e.key;
  }

  renderText();

  document.querySelectorAll(".key").forEach(k=>k.classList.remove("active"));
  let key=document.getElementById("k-"+e.key.toLowerCase());
  if(key) key.classList.add("active");

  let t=(new Date()-start)/1000;
  document.getElementById("time").innerText="00:"+Math.floor(t);
});

/* NEXT */
function next(){
  alert("Next Lesson");
}

renderKeyboard();
renderBars();
renderText();

</script>

</body>
</html>
