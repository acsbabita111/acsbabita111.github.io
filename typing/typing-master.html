<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Typing Master Mobile</title>

<style>
body {
  font-family: 'Noto Sans Devanagari', sans-serif;
  margin: 0;
  background: #f5f7fa;
}

.container {
  max-width: 430px;
  margin: auto;
  padding: 10px;
}

.header {
  font-size: 14px;
  color: #555;
}

.progress {
  margin-top: 5px;
  font-size: 12px;
}

.text-box {
  background: #e8f5e9;
  padding: 10px;
  margin-top: 10px;
  border-radius: 8px;
  font-size: 16px;
}

.input-box {
  margin-top: 10px;
}

textarea {
  width: 100%;
  height: 100px;
  font-size: 16px;
  padding: 10px;
  border-radius: 8px;
  border: 1px solid #ccc;
}

.result {
  margin-top: 10px;
  font-size: 14px;
}

button {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  border: none;
  border-radius: 8px;
  font-size: 16px;
}

.next {
  background: #4caf50;
  color: white;
}

.timer {
  font-size: 12px;
  color: #888;
  margin-top: 5px;
}
</style>
</head>

<body>

<div class="container">

<div class="header">Typing Practice (OTG Keyboard)</div>
<div class="progress" id="progress">Lesson 1 / 40</div>

<div class="text-box" id="text"></div>

<div class="input-box">
<textarea id="input" placeholder="यहाँ टाइप करें..."></textarea>
</div>

<div class="timer" id="timer">Time: 0s</div>

<div class="result" id="result"></div>

<button class="next" onclick="nextLesson()">Next</button>

</div>

<script>

const lessons = [

"asdf jkl;",
"asdf asdf jkl; jkl;",
"aaa sss ddd fff jjj kkk lll",
"asdf jkl; asdf jkl;",
"as as df df jk jk ll ;;",
"qwer uiop",
"qwe qwe rty rty uio uio",
"qq ww ee rr tt yy uu ii oo pp",
"qwerty uiop qwerty",
"zxcv nm",
"zxc zxc vbn vbn",
"zzz xxx ccc vvv bbb nnn mmm",
"zxcv zxcv nm nm",
"asdf qwer zxcv",
"asdf qwer zxcv uiop",
"hello world",
"this is typing practice",
"mobile typing master course",
"practice makes perfect",
"typing speed test start",
"improve your typing speed",
"learn typing step by step",
"accuracy is important",
"never look at keyboard",
"focus on screen only",
"typing is a skill",
"develop muscle memory",
"daily practice required",
"slow is smooth smooth is fast",
"keep practicing daily",
"typing improves productivity",
"real world typing test",
"chat like whatsapp typing",
"write fast and accurate",
"improve your focus",
"stay consistent",
"final practice level",
"full keyboard mastery",
"speed and accuracy test",
"congratulations you completed course"

];

let current = 0;
let startTime;

function loadLesson() {
  document.getElementById("text").innerText = lessons[current];
  document.getElementById("input").value = "";
  document.getElementById("result").innerText = "";
  document.getElementById("progress").innerText = `Lesson ${current+1} / 40`;
  startTime = new Date();
}

document.getElementById("input").addEventListener("input", function() {

  let typed = this.value;
  let target = lessons[current];

  let correct = 0;

  for (let i = 0; i < typed.length; i++) {
    if (typed[i] === target[i]) correct++;
  }

  let accuracy = Math.round((correct / target.length) * 100);

  let time = (new Date() - startTime) / 1000;
  document.getElementById("timer").innerText = "Time: " + Math.floor(time) + "s";

  let wpm = Math.round((typed.length / 5) / (time / 60));

  document.getElementById("result").innerText =
    "Accuracy: " + accuracy + "% | WPM: " + (wpm || 0);

});

function nextLesson() {
  if (current < lessons.length - 1) {
    current++;
    loadLesson();
  } else {
    alert("Course Completed 🎉");
  }
}

loadLesson();

</script>

</body>
</html>
