<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>लेसन चुनें</title>

<style>
body{
    margin:0;
    font-family:sans-serif;
    background:#f5f7fb;
}

/* container */
.container{
    max-width:430px;
    margin:auto;
    padding:12px;
}

/* heading */
.header{
    text-align:center;
    margin-bottom:15px;
}

.header h1{
    font-size:22px;
    margin:0;
}

.header p{
    font-size:14px;
    color:#555;
}

/* progress */
.progress{
    text-align:center;
    font-size:13px;
    margin-bottom:10px;
}

/* section */
.section{
    background:#fff;
    padding:15px;
    border-radius:15px;
    margin-bottom:15px;
    box-shadow:0 5px 15px rgba(0,0,0,0.08);
}

/* title */
.title{
    font-weight:bold;
    margin-bottom:10px;
}

/* grid */
.grid{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:8px;
}

/* button */
.btn{
    text-align:center;
    padding:10px 0;
    border-radius:8px;
    text-decoration:none;
    font-size:14px;
    font-weight:bold;
}

/* colors */
.level{ background:#4CAF50; color:#fff; }
.chapter{ background:#9C27B0; color:#fff; }
.lesson{ background:#2196F3; color:#fff; }
.lock{ background:#ccc; color:#666; }

/* start */
.start{
    display:block;
    text-align:center;
    background:#00C853;
    color:#fff;
    padding:15px;
    border-radius:25px;
    font-size:18px;
    text-decoration:none;
}
</style>
</head>

<body>
