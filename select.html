
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Selection Page</title>

<style>
body{
    margin:0;
    font-family:sans-serif;
    background:#f4f7ff;
}

.container{
    max-width:430px;
    margin:auto;
    padding:12px;
}

/* TOP BAR */
.top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px;
}

.home{
    background:#fff;
    padding:8px 12px;
    border-radius:20px;
    text-decoration:none;
    font-weight:bold;
}

.subbu{
    width:50px;
    height:50px;
    border-radius:50%;
}

/* BOX */
.box{
    background:#fff;
    padding:15px;
    border-radius:15px;
    margin-bottom:12px;
}

/* LEVEL */
.level{
    background:#0d47a1;
    color:#fff;
    padding:12px;
    border-radius:10px;
    margin-bottom:8px;
    cursor:pointer;
    text-align:center;
}

/* CHAPTER */
.chapter{
    background:#eee;
    padding:10px;
    border-radius:8px;
    margin:5px 0;
    cursor:pointer;
}

/* LESSON */
.lesson{
    display:inline-block;
    padding:8px 10px;
    margin:3px;
    background:#ddd;
    border-radius:6px;
    cursor:pointer;
}

.selected{
    background:#ff9800;
    color:#fff;
}

/* START */
.start{
    display:block;
    text-align:center;
    background:#00c853;
    color:#fff;
    padding:15px;
    border-radius:20px;
    font-size:18px;
    text-decoration:none;
    margin-top:10px;
}

/* AI BUTTON */
.ai-btn{
    position:fixed;
    bottom:20px;
    right:20px;
    background:#ff5722;
    color:#fff;
    padding:15px;
    border-radius:50%;
    font-size:20px;
    cursor:pointer;
}

/* POPUP */
.popup{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    background:#fff;
    height:60%;
    display:none;
    flex-direction:column;
    border-top-left-radius:20px;
    border-top-right-radius:20px;
}

.chat{
    flex:1;
    overflow:auto;
    padding:10px;
}

.input{
    display:flex;
    gap:5px;
    padding:10px;
}

input{
    flex:1;
    padding:10px;
}

/* BUTTONS */
.btn{
    padding:10px;
    cursor:pointer;
}
</style>
</head>

<body>

<div class="container">

<div class="top">
<a href="index.html" class="home">🏠 Home</a>
<img src="subbu.jpg" class="subbu">
</div>

<div class="box">

<div class="level" onclick="toggle('l1')">लेवल 1</div>
<div id="l1" style="display:none">

<div class="chapter" onclick="toggle('c1')">चैप्टर 1</div>
<div id="c1" style="display:none">
<span class="lesson" onclick="selectLesson('L001',this)">L001</span>
<span class="lesson" onclick="selectLesson('L002',this)">L002</span>
<span class="lesson" onclick="selectLesson('L003',this)">L003</span>
</div>

</div>

</div>

<div id="selectedBox" class="box">
चुना गया: कोई नहीं
</div>

<a id="startBtn" href="#" class="start">कोर्स शुरू करें</a>

</div>

<!-- AI BUTTON -->
<div class="ai-btn" onclick="openAI()">🤖</div>

<!-- POPUP -->
<div class="popup" id="popup">

<div class="chat" id="chat"></div>

<div class="input">
<input type="text" id="text">
<button class="btn" onclick="send()">➤</button>
<button class="btn" onclick="voice()">🎤</button>
<input type="file" accept="image/*" onchange="imageUpload(event)">
</div>

</div>

<script>

/* ACCORDION */
function toggle(id){
    let el=document.getElementById(id);
    el.style.display = el.style.display=="none"?"block":"none";
}

/* LESSON SELECT */
let selected="";

function selectLesson(id,el){
    selected=id;
    document.querySelectorAll('.lesson').forEach(x=>x.classList.remove('selected'));
    el.classList.add('selected');

    document.getElementById('selectedBox').innerText="चुना गया: "+id;

    document.getElementById('startBtn').href=id+".html";

    speak("आपने "+id+" चुना है");
}

/* SPEAK */
function speak(text){
    let u=new SpeechSynthesisUtterance(text);
    u.lang="hi-IN";
    speechSynthesis.speak(u);
}

/* AI POPUP */
function openAI(){
    let p=document.getElementById('popup');
    p.style.display="flex";
}

/* SEND */
function send(){
    let text=document.getElementById('text').value;
    addChat("आप: "+text);

    let reply="AI: "+text+" का जवाब यहाँ आएगा";
    addChat(reply);
    speak(reply);
}

/* CHAT ADD */
function addChat(msg){
    let div=document.createElement('div');
    div.innerText=msg;
    document.getElementById('chat').appendChild(div);
}

/* VOICE INPUT */
function voice(){
    let r=new webkitSpeechRecognition();
    r.lang="hi-IN";
    r.start();
    r.onresult=function(e){
        document.getElementById('text').value=e.results[0][0].transcript;
    }
}

/* IMAGE */
function imageUpload(e){
    let file=e.target.files[0];
    addChat("📷 फोटो अपलोड किया गया");
}

</script>

</body>
</html>
