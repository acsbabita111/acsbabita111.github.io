<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>एसीएस एआई डिजिटल मास्टर</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#f3f0ff;
      --text:#1e1e1e;

      --blue:#0044ff;
      --blue-dark:#002ea8;

      --purple:#8b00ff;
      --purple-dark:#6500b8;

      --green:#00c853;
      --green-dark:#00963e;

      --orange:#ff9100;
      --orange-dark:#d97706;

      --yellow:#ffe45c;
      --sky:#79d2ff;
      --pink:#ff68dc;

      --shadow:0 8px 18px rgba(0,0,0,.12);
      --soft-shadow:0 4px 10px rgba(0,0,0,.08);

      --inactive-bg:#e9edf5;
      --inactive-text:#7a8494;
      --inactive-border:#d1d8e3;

      --about-dark-1:#07111f;
      --about-dark-2:#101b31;
      --about-dark-3:#17284a;
    }

    *{
      box-sizing:border-box;
      -webkit-tap-highlight-color:transparent;
    }

    html, body{
      margin:0;
      width:100%;
      height:100%;
      overflow:hidden;
      font-family:"Hind","Noto Sans Devanagari",sans-serif;
      background:var(--bg);
      color:var(--text);
    }

    body{
      display:flex;
      justify-content:center;
    }

    .मोबाइल-पृष्ठ{
      width:100%;
      max-width:430px;
      height:100dvh;
      padding:10px;
      display:flex;
      flex-direction:column;
      gap:10px;
      overflow:hidden;
      background:var(--bg);
    }

    /* ===== HEADER ===== */
    .मुख्य-हेडर{
      position:relative;
      background:linear-gradient(180deg,#ff9933 0%, #ffffff 50%, #138808 100%);
      border-radius:26px;
      padding:16px 10px 14px;
      text-align:center;
      box-shadow:var(--shadow);
      flex:0 0 auto;
      overflow:hidden;
    }

    .मुख्य-हेडर::before{
      content:"";
      position:absolute;
      inset:0;
      background:
        radial-gradient(circle at 15% 18%, rgba(255,255,255,.30), transparent 26%),
        radial-gradient(circle at 85% 12%, rgba(255,255,255,.18), transparent 20%);
      pointer-events:none;
    }

    .कोर्स-नाम{
      position:relative;
      z-index:1;
      margin:0;
      font-size:1.22rem;
      line-height:1.18;
      font-weight:700;
      color:#111;
    }

    .कोर्स-उपशीर्षक{
      position:relative;
      z-index:1;
      margin-top:4px;
      font-size:.88rem;
      font-weight:600;
      color:#222;
    }

    /* ===== TOP ACTION AREA ===== */
    .ऊपर-खंड{
      display:grid;
      grid-template-columns:1fr 92px 1fr;
      gap:10px;
      align-items:center;
      flex:0 0 auto;
    }

    .दो-बटन-स्तंभ{
      display:flex;
      flex-direction:column;
      gap:10px;
    }

    .ऊपर-बटन{
      min-height:58px;
      border:none;
      border-radius:18px;
      font-size:1rem;
      font-weight:700;
      font-family:inherit;
      cursor:pointer;
      box-shadow:var(--shadow);
      transition:transform .12s ease, opacity .12s ease, box-shadow .12s ease;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      padding:8px 10px;
      line-height:1.2;
      text-decoration:none;
    }

    .ऊपर-बटन:active,
    .चयन-हेडर:active,
    .चयन-बॉक्स:active,
    .मुख्य-शुरू-बटन:active,
    .नीचे-बटन:active,
    .पॉपअप-बंद:active,
    .भेजो-बटन:active,
    .बोलो-बटन:active,
    .फोटो-बटन:active{
      transform:scale(.96);
      opacity:.92;
      box-shadow:0 4px 10px rgba(0,0,0,.10);
    }

    .होम-बटन{
      background:linear-gradient(180deg,#dce8ff,#b8cfff);
      color:#0d3da6;
      border:2px solid #8fb1ff;
    }

    .कोर्स-बटन{
      background:linear-gradient(180deg,#fff7e8,#ffe7bb);
      color:#8a4c00;
      border:2px solid #ffc96b;
    }

    .एआई-बटन{
      background:linear-gradient(180deg,#ffb84d,#ff9100);
      color:#fff;
      border:2px solid #ff9f1c;
    }

    .सुनो-ऊपर-बटन{
      background:linear-gradient(180deg,#4a68c7,#243c8d);
      color:#fff;
      border:2px solid #3354ba;
    }

    .मध्य-चित्र{
      width:92px;
      height:92px;
      border-radius:50%;
      overflow:hidden;
      background:#fff;
      padding:4px;
      box-shadow:0 10px 20px rgba(0,0,0,.16);
    }

    .मध्य-चित्र img{
      width:100%;
      height:100%;
      object-fit:cover;
      border-radius:50%;
      display:block;
    }

    /* ===== MAIN GATEWAY ===== */
    .गेटवे-फ्रेम{
      background:linear-gradient(180deg,#8dd9ff 0%, #73d0ff 100%);
      border-radius:28px;
      padding:12px;
      box-shadow:var(--shadow);
      flex:1 1 auto;
      min-height:0;
      display:flex;
      flex-direction:column;
      gap:12px;
      overflow:hidden;
    }

    /* Pink course selector strip */
    .चयन-हेडर{
      position:relative;
      background:linear-gradient(180deg,#ff93ea,#ff62da);
      color:#111;
      text-align:center;
      border:none;
      border-radius:18px;
      padding:12px 14px;
      min-height:76px;
      font-family:inherit;
      cursor:pointer;
      box-shadow:var(--soft-shadow);
      flex:0 0 auto;
      overflow:hidden;
    }

    .चयन-हेडर .ऊपर-पंक्ति{
      display:block;
      font-size:1.24rem;
      font-weight:700;
      line-height:1.1;
    }

    .चयन-हेडर .नीचे-पंक्ति{
      display:block;
      margin-top:6px;
      font-size:1.02rem;
      font-weight:700;
      color:#17325c;
      line-height:1.15;
    }

    /* Three selection boxes */
    .तीन-बॉक्स-पंक्ति{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:10px;
      flex:1 1 auto;
      min-height:0;
    }

    .चयन-बॉक्स{
      position:relative;
      border:none;
      border-radius:18px;
      min-height:105px;
      box-shadow:var(--shadow);
      padding:10px 6px 8px;
      display:flex;
      flex-direction:column;
      justify-content:flex-start;
      align-items:center;
      text-align:center;
      cursor:pointer;
      overflow:hidden;
      transition:transform .12s ease, opacity .12s ease, box-shadow .12s ease, background .3s ease;
    }

    /* GAME STATE COLORS */
    
    /* Active State - Yellow (Need to touch) */
    .चयन-बॉक्स.active{
      background:linear-gradient(180deg,#fff067,#ffe24c 58%, #e7be12 100%);
      color:#1d1d1d;
    }

    /* Completed State - Green (Already selected) */
    .चयन-बॉक्स.completed{
      background:linear-gradient(180deg,#35d26f,#00a748);
      color:#fff;
    }
    
    .चयन-बॉक्स.completed .बॉक्स-लेबल,
    .चयन-बॉक्स.completed .बॉक्स-मूल्य{
      color:#fff;
    }

    /* Inactive State - Gray */
    .चयन-बॉक्स.inactive{
      background:linear-gradient(180deg,#eef2f7,#dfe6ef);
      color:var(--inactive-text);
      box-shadow:none;
      border:2px solid var(--inactive-border);
      cursor:not-allowed;
      filter:grayscale(.08);
    }

    .चयन-बॉक्स .बॉक्स-लेबल{
      font-size:1.02rem;
      font-weight:700;
      line-height:1.05;
      color:#1d1d1d;
    }

    .चयन-बॉक्स.inactive .बॉक्स-लेबल{
      color:var(--inactive-text);
    }

    .चयन-बॉक्स .बॉक्स-मूल्य{
      margin-top:12px;
      font-size:1rem;
      font-weight:700;
      line-height:1.18;
      color:#15325c;
      word-break:break-word;
      padding:0 2px;
    }

    .चयन-बॉक्स.inactive .बॉक्स-मूल्य{
      color:var(--inactive-text);
    }

    /* Invisible native selects */
    .छिपा-सेलेक्ट{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      opacity:0;
      cursor:pointer;
      border:none;
      z-index:10;
    }

    .छिपा-सेलेक्ट:disabled{
      cursor:not-allowed;
    }

    /* Start button */
    .मुख्य-शुरू-बटन{
      border:none;
      background:linear-gradient(180deg,#ffe96d 0%, #ffd83a 55%, #e9bc00 100%);
      color:#1a1a1a;
      border-radius:18px;
      min-height:76px;
      font-size:2rem;
      font-weight:700;
      font-family:inherit;
      cursor:pointer;
      box-shadow:
        0 10px 18px rgba(0,0,0,.14),
        inset 0 2px 0 rgba(255,255,255,.55),
        inset 0 -3px 0 rgba(0,0,0,.12);
      flex:0 0 auto;
      transition:transform .12s ease, box-shadow .12s ease, opacity .12s ease;
    }

    .मुख्य-शुरू-बटन:disabled{
      background:linear-gradient(180deg,#ededed,#d9d9d9);
      color:#777;
      box-shadow:none;
      cursor:not-allowed;
    }

    /* Bottom nav */
    .नीचे-पंक्ति{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:10px;
      flex:0 0 auto;
    }

    .नीचे-बटन{
      min-height:58px;
      border:none;
      border-radius:14px;
      color:#fff;
      font-size:1.02rem;
      font-weight:700;
      font-family:inherit;
      cursor:pointer;
      box-shadow:var(--shadow);
      transition:transform .12s ease, opacity .12s ease;
    }

    .पिछे{ background:linear-gradient(180deg,#2f61ff,#0037d6); }
    .रिज्यूम{ background:linear-gradient(180deg,#4a68c7,#243c8d); }
    .आगे{ background:linear-gradient(180deg,#35d26f,#00a748); }

    .नीचे-बटन.disabled{
      background:linear-gradient(180deg,#dfe5ee,#c6cfdb);
      color:#7c8798;
      box-shadow:none;
      cursor:not-allowed;
    }

    /* ===== ABOUT FULL SCREEN ===== */
    .पर्दा{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.55);
      display:none;
      z-index:200;
    }

    .पर्दा.दिखाओ{ display:block; }

    .शीट{
      position:fixed;
      inset:0;
      max-width:430px;
      margin:0 auto;
      background:
        radial-gradient(circle at 20% 10%, rgba(88,166,255,.18), transparent 24%),
        radial-gradient(circle at 80% 14%, rgba(255,184,77,.14), transparent 24%),
        linear-gradient(180deg,var(--about-dark-1) 0%, var(--about-dark-2) 52%, var(--about-dark-3) 100%);
      z-index:210;
      display:none;
      flex-direction:column;
      color:#fff;
      overflow:hidden;
    }

    .शीट.दिखाओ{ display:flex; }

    .शीट-शीर्ष{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:10px;
      padding:18px 16px 10px;
      flex:0 0 auto;
    }

    .शीट-ब्रांड{
      max-width:80%;
    }

    .शीट-ब्रांड h2{
      margin:0;
      font-size:1.35rem;
      line-height:1.12;
      font-weight:700;
    }

    .शीट-ब्रांड p{
      margin:5px 0 0;
      font-size:.88rem;
      color:#cdd9ea;
      font-weight:600;
      line-height:1.3;
    }

    .पॉपअप-बंद{
      border:none;
      background:rgba(255,255,255,.10);
      color:#fff;
      border-radius:12px;
      padding:10px 12px;
      font-size:1rem;
      font-weight:700;
      font-family:inherit;
      cursor:pointer;
      box-shadow:0 4px 10px rgba(0,0,0,.12);
      backdrop-filter:blur(4px);
    }

    .शीट-अंदर{
      flex:1 1 auto;
      overflow:auto;
      padding:8px 16px 18px;
    }

    .अंदर-कार्ड{
      background:rgba(255,255,255,.08);
      border:1px solid rgba(255,255,255,.10);
      border-radius:24px;
      box-shadow:0 10px 22px rgba(0,0,0,.18);
      padding:16px 14px;
      margin-bottom:14px;
      backdrop-filter:blur(4px);
    }

    .अंदर-शीर्षक{
      text-align:center;
      font-size:1.32rem;
      font-weight:700;
      margin-bottom:12px;
      line-height:1.22;
    }

    .अंदर-पाठ{
      text-align:center;
      font-size:1.08rem;
      line-height:1.78;
      color:#f3f7ff;
      font-weight:600;
    }

    .अंदर-पाठ b{
      color:#fff6c7;
    }

    .शीट-सुब्बू{
      width:122px;
      height:122px;
      border-radius:50%;
      overflow:hidden;
      background:#fff;
      padding:4px;
      box-shadow:0 12px 24px rgba(0,0,0,.24);
      margin:0 auto 12px;
    }

    .शीट-सुब्बू img{
      width:100%;
      height:100%;
      object-fit:cover;
      border-radius:50%;
      display:block;
    }

    .शीट-स्लोगन{
      text-align:center;
      font-size:1.18rem;
      line-height:1.35;
      font-weight:700;
      color:#ffb84d;
      margin-top:2px;
    }

    .छात्रवृत्ति-कार्ड{
      background:linear-gradient(180deg,rgba(255,184,77,.18),rgba(34,197,94,.16));
      border:1px solid rgba(255,255,255,.14);
      border-radius:24px;
      box-shadow:0 14px 30px rgba(0,0,0,.22);
      padding:18px 14px;
      margin-top:8px;
      text-align:center;
    }

    .छात्रवृत्ति-शीर्षक{
      font-size:1.3rem;
      font-weight:700;
      color:#fff;
      line-height:1.2;
      margin-bottom:10px;
    }

    .छात्रवृत्ति-मुख्य{
      font-size:1.18rem;
      font-weight:700;
      color:#fff8d6;
      line-height:1.55;
    }

    .छात्रवृत्ति-मुख्य span{
      display:block;
      font-size:1.55rem;
      line-height:1.2;
      color:#fff;
      margin:8px 0 6px;
    }

    /* ===== AI HELP ===== */
    .एआई-पर्दा{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.40);
      display:none;
      z-index:220;
    }

    .एआई-पर्दा.दिखाओ{ display:block; }

    .एआई-शीट{
      position:fixed;
      left:0;
      right:0;
      bottom:-100%;
      max-width:430px;
      margin:0 auto;
      height:72vh;
      background:#fff;
      border-top-left-radius:24px;
      border-top-right-radius:24px;
      box-shadow:0 -10px 26px rgba(0,0,0,.2);
      z-index:230;
      transition:bottom .25s ease;
      display:flex;
      flex-direction:column;
    }

    .एआई-शीट.दिखाओ{ bottom:0; }

    .एआई-ऊपर{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      padding:14px;
      border-bottom:1px solid #e9eef7;
      flex:0 0 auto;
    }

    .एआई-शीर्षक{
      font-size:1.15rem;
      font-weight:700;
    }

    .एआई-उप{
      font-size:.83rem;
      color:#666;
      margin-top:2px;
    }

    .एआई-चैट{
      flex:1 1 auto;
      overflow:auto;
      padding:12px;
      background:#f8fbff;
    }

    .बुलबुला{
      max-width:88%;
      padding:10px 12px;
      border-radius:16px;
      margin-bottom:10px;
      font-size:1rem;
      line-height:1.5;
      word-break:break-word;
    }

    .उपयोगकर्ता{
      margin-left:auto;
      background:#dff4ff;
      color:#14365e;
      border-bottom-right-radius:6px;
    }

    .सहायक{
      margin-right:auto;
      background:#fff;
      color:#1f3051;
      border:1px solid #e6edf8;
      border-bottom-left-radius:6px;
    }

    .चित्र-पूर्वावलोकन{
      background:#fff;
      border:1px dashed #c9d6ec;
      border-radius:16px;
      padding:10px;
      margin:0 12px 10px;
      text-align:center;
      display:none;
    }

    .चित्र-पूर्वावलोकन img{
      max-width:100%;
      max-height:160px;
      border-radius:12px;
    }

    .एआई-इनपुट{
      padding:10px 12px 14px;
      border-top:1px solid #edf2f8;
      background:#fff;
      flex:0 0 auto;
    }

    .औज़ार{
      display:flex;
      gap:8px;
      margin-bottom:8px;
    }

    .फोटो-बटन,
    .बोलो-बटन,
    .भेजो-बटन{
      border:none;
      border-radius:14px;
      padding:12px;
      font-weight:700;
      cursor:pointer;
      font-size:1rem;
      font-family:inherit;
    }

    .फोटो-बटन{
      background:#fff0e8;
      color:#d95a16;
    }

    .बोलो-बटन{
      background:#eef4ff;
      color:#1f56d8;
    }

    .इनपुट-पंक्ति{
      display:flex;
      gap:8px;
      align-items:center;
    }

    .एआई-टेक्स्ट{
      flex:1;
      border:1px solid #dce6f6;
      background:#f9fbff;
      border-radius:16px;
      padding:13px 14px;
      font-size:1rem;
      outline:none;
      color:#1d2e4b;
      font-family:inherit;
    }

    .भेजो-बटन{
      background:#0f5fff;
      color:#fff;
      min-width:62px;
    }

    .छिपा{ display:none !important; }

    @media (max-width:380px){
      .ऊपर-खंड{ grid-template-columns:1fr 82px 1fr; }
      .मध्य-चित्र{ width:82px; height:82px; }
      .ऊपर-बटन{ min-height:54px; font-size:.92rem; }
      .चयन-हेडर{ min-height:72px; }
      .चयन-हेडर .ऊपर-पंक्ति{ font-size:1.12rem; }
      .चयन-हेडर .नीचे-पंक्ति{ font-size:.95rem; }
      .चयन-बॉक्स{ min-height:95px; } 
      .मुख्य-शुरू-बटन{ font-size:1.72rem; min-height:70px; }
      .नीचे-बटन{ font-size:.92rem; }
      .अंदर-पाठ{ font-size:1rem; }
      .छात्रवृत्ति-शीर्षक{ font-size:1.18rem; }
      .छात्रवृत्ति-मुख्य span{ font-size:1.35rem; }
    }
  </style>
</head>
<body>

<div class="मोबाइल-पृष्ठ">

  <header class="मुख्य-हेडर">
    <h1 class="कोर्स-नाम">एसीएस एआई डिजिटल मास्टर</h1>
    <div class="कोर्स-उपशीर्षक">पावर्ड बाय रामभरोस विद्यार्थी</div>
  </header>

  <section class="ऊपर-खंड">
    <div class="दो-बटन-स्तंभ">
      <a href="index.html" class="ऊपर-बटन होम-बटन">🏠 होम</a>
      <button class="ऊपर-बटन कोर्स-बटन" onclick="खोलोकोर्स()">📘 कोर्स के बारे में</button>
    </div>

    <div class="मध्य-चित्र">
      <img src="subbu.jpg" alt="Subbu">
    </div>
