<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ACS-AI DIGITAL MASTER Dashboard</title>
    <style>
        /* आपकी पूरी CSS यहाँ से शुरू होती है */
        :root {
            --primary-bg: #e0f2fe;
            --accent-pink: #ff00ff;
            --accent-blue: #38bdf8;
            --text-dark: #1e293b;
        }
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background-color: var(--primary-bg); color: var(--text-dark); }
        .शीर्षक-पट्टी { background: linear-gradient(to bottom, #f97316, #ffffff, #22c55e); padding: 15px; text-align: center; border-bottom-left-radius: 25px; border-bottom-right-radius: 25px; }
        .मुख्य-ग्रिड { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 15px; }
        .बटन-कार्ड { background: #ffffff; border-radius: 18px; padding: 12px; display: flex; align-items: center; justify-content: center; text-decoration: none; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .प्रोफाइल-गोला { grid-column: span 2; justify-self: center; width: 100px; height: 100px; border-radius: 50%; border: 4px solid #fff; overflow: hidden; }
        .प्रोफाइल-गोला img { width: 100%; height: 100%; object-fit: cover; }
        
        .गेटवे-फ्रेम { padding: 0 12px; }
        .चयन-हेडर { 
            background: linear-gradient(135deg, #ff00ff 0%, #ff00cc 100%); 
            border-radius: 20px; padding: 20px; text-align: center; color: white; 
            position: relative; box-shadow: 0 8px 20px rgba(255, 0, 255, 0.3);
        }
        .ऊपर-पंक्ति { font-size: 18px; font-weight: 800; display: block; }
        .छिपा-सेलेक्ट { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
        
        .तीन-बॉक्स-पंक्ति { display: flex; gap: 10px; margin-top: 15px; }
        .चयन-बॉक्स { flex: 1; background: #ffffff; border-radius: 15px; padding: 12px 5px; text-align: center; border: 1px solid #cbd5e1; }
        .चयन-बॉक्स.inactive { opacity: 0.6; filter: grayscale(1); }
        .बॉक्स-लेबल { font-size: 11px; color: #64748b; }
        .बॉक्स-मूल्य { font-size: 14px; font-weight: 800; }
        
        /* आपकी बाकी 1000 लाइन की CSS और अन्य स्टाइल्स यहाँ चालू रहेंगी... */
    </style>
</head>
<body>

    <div class="शीर्षक-पट्टी">
        <h1 style="font-size: 22px; margin: 0;">एसीएस एआई डिजिटल मास्टर</h1>
        <p style="font-size: 12px; margin: 5px 0;">पावर्ड बाय रामभरोस विद्यार्थी</p>
    </div>

    <div class="मुख्य-ग्रिड">
        <a href="#" class="बटन-कार्ड" style="background: #cbd5ff;">🏠 होम</a>
        <a href="#" class="बटन-कार्ड" style="background: #ffb84d;">🤖 ए आई मदद</a>
        <div class="प्रोफाइल-गोला">
            <img src="https://raw.githubusercontent.com/acsbabita111/acsbabita111.github.io/main/girl.jpg">
        </div>
        <a href="#" class="बटन-कार्ड" style="background: #ffe4b3;">📘 कोर्स के बारे में</a>
        <a href="#" class="बटन-कार्ड" style="background: #3b82f6; color: white;">🔊 सुनो</a>
    </div>

    <section class="गेटवे-फ्रेम">
        <div class="चयन-हेडर">
            <span class="ऊपर-पंक्ति">अपना कोर्स चुनिए</span>
            <select class="छिपा-सेलेक्ट" id="कोर्ससेलेक्ट" onchange="कोर्सबदला()">
                <option value="">अपना कोर्स चुनिए</option>
                <option value="ai_digital_master">एआई डिजिटल मास्टर</option>
                <option value="typing_master">टाइपिंग मास्टर</option>
            </select>
            
            <div style="margin-top: 15px; padding: 0 5px;">
                <a href="/typing/index.html" style="background-color: #f97316; color: white; padding: 12px 0; text-decoration: none; font-size: 18px; font-weight: bold; border-radius: 10px; display: block; box-shadow: 0 4px 6px rgba(0,0,0,0.2); border: 2px solid #ea580c; width: 100%;">
                    ⌨️ ACS Typing Master (अभ्यास) ➔
                </a>
                <p style="font-size: 11px; color: #ffffff; margin-top: 5px; font-weight: bold; margin-bottom: 0;">
                    * केवल मोबाइल (Landscape) + OTG कीबोर्ड
                </p>
            </div>
        </div>

        <div class="तीन-बॉक्स-पंक्ति">
            <div class="चयन-बॉक्स inactive" id="लेवलबॉक्स">
                <div class="बॉक्स-लेबल">लेवल</div>
                <div class="बॉक्स-मूल्य" id="लेवलमूल्य">लेवल</div>
                <select class="छिपा-सेलेक्ट" id="लेवलसेलेक्ट" disabled onchange="लेवलबदला()">
                    <option value="">लेवल चुनिए</option>
                </select>
            </div>
            <div class="चयन-बॉक्स inactive" id="चैप्टरबॉक्स">
                <div class="बॉक्स-लेबल">चैप्टर</div>
                <div class="बॉक्स-मूल्य" id="चैप्टरमूल्य">चैप्टर</div>
                <select class="छिपा-सेलेक्ट" id="चैप्टरसेलेक्ट" disabled onchange="चैप्टरबदला()">
                    <option value="">चैप्टर चुनिए</option>
                </select>
            </div>
            <div class="चयन-बॉक्स inactive" id="लेसनबॉक्स">
                <div class="बॉक्स-लेबल">लेसन</div>
                <div class="बॉक्स-मूल्य" id="लेसनमूल्य">लेसन</div>
                <select class="छिपा-सेलेक्ट" id="लेसनसेलेक्ट" disabled onchange="लेसनबदला()">
                    <option value="">लेसन चुनिए</option>
                </select>
            </div>
        </div>
    </section>

    <script>
        // आपका पूरा पुराना जावास्क्रिप्ट लॉजिक (L001-L150, पेमेंट चेक, आदि) यहाँ रहेगा
        function कोर्सबदला() { /* आपकी पुरानी कोडिंग */ }
        function लेवलबदला() { /* आपकी पुरानी कोडिंग */ }
        // ... बाकी का पूरा कोड ...
    </script>
</body>
</html>
