<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ACS AI DIGITAL MASTER</title>

<style>
body{
  margin:0;
  font-family:sans-serif;
  background:#f4f7ff;
}

.wrap{
  max-width:430px;
  margin:auto;
  padding:12px;
}

/* TOP BAR */
.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:#fff;
  padding:10px;
  border-radius:16px;
  box-shadow:0 4px 12px rgba(0,0,0,.08);
}

.topbar img{
  width:40px;
  border-radius:50%;
}

.home-btn{
  text-decoration:none;
  font-weight:bold;
  background:#eef3ff;
  padding:8px 12px;
  border-radius:20px;
}

/* MAIN TITLE */
.main-title{
  text-align:center;
  font-size:20px;
  font-weight:900;
  margin:12px 0;
}

/* COURSE BLOCK */
.course-box{
  background:#fff;
  border-radius:18px;
  padding:14px;
  box-shadow:0 5px 15px rgba(0,0,0,.08);
}

.level{
  margin-bottom:12px;
}

.level button{
  width:100%;
  border:none;
  padding:14px;
  border-radius:14px;
  font-size:18px;
  font-weight:bold;
  color:#fff;
}

.l1{background:#165dff;}
.l2{background:#7a2cff;}
.l3{background:#09a753;}

.chapter{
  margin-top:8px;
}

.chapter button{
  width:100%;
  border:none;
  padding:10px;
  margin-top:6px;
  border-radius:10px;
  font-weight:bold;
  background:#eef2ff;
}

.lesson-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:6px;
  margin-top:6px;
}

.lesson{
  background:#eaf1ff;
  border:none;
  padding:10px;
  border-radius:10px;
  font-weight:bold;
}

/* ABOUT */
.about{
  margin-top:12px;
  background:#fff;
  padding:12px;
  border-radius:16px;
  box-shadow:0 4px 12px rgba(0,0,0,.08);
}

.about h3{
  margin:0 0 6px;
}

.about p{
  font-size:14px;
  line-height:1.6;
}

/* BUTTON */
.start-btn{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  max-width:430px;
  margin:auto;
  background:#12a63a;
  color:#fff;
  padding:16px;
  font-size:20px;
  border:none;
  font-weight:bold;
}

</style>
</head>

<body>

<div class="wrap">

<div class="topbar">
  <a href="index.html" class="home-btn">🏠 Home</a>
  <img src="subbu.jpg">
</div>

<div class="main-title">
  लेसन चुनिए → शुरू कीजिए 🚀
</div>

<div class="course-box">

<div class="level">
<button class="l1">लेवल 1</button>

<div class="chapter">
<button>चैप्टर 1</button>

<div class="lesson-grid">
<button class="lesson" onclick="go('L001')">01</button>
<button class="lesson" onclick="go('L002')">02</button>
<button class="lesson" onclick="go('L003')">03</button>
<button class="lesson" onclick="go('L004')">04</button>
</div>

</div>
</div>

</div>

<div class="about">
<h3>कोर्स के बारे में</h3>
<p>
यह कोर्स मोबाइल आधारित है और आपको डिजिटल मास्टर बनाता है।
</p>
</div>

</div>

<button class="start-btn" onclick="start()">👉 कोर्स शुरू करें</button>

<script>
let selected = "";

function go(id){
  selected = id;
  alert(id + " चुना गया");
}

function start(){
  if(!selected){
    alert("पहले लेसन चुनिए");
    return;
  }
  window.location.href = selected + ".html";
}
</script>

</body>
</html>
