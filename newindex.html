
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ACS AI DIGITAL MASTER</title>

<style>
body {
    margin: 0;
    font-family: sans-serif;
    background: #f5f7fb;
    text-align: center;
}

/* HERO */
.hero {
    position: relative;
    width: 100%;
    height: 60vh;
    border-bottom-left-radius: 25px;
    border-bottom-right-radius: 25px;
    overflow: hidden;
}

.hero img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

/* LOGO */
.logo {
    position: absolute;
    top: 10px;
    left: 10px;
    width: 45px;
}

/* TITLE */
.hero-text {
    position: absolute;
    bottom: 15px;
    width: 100%;
    color: white;
}

.hero-text h1 {
    margin: 0;
    font-size: 26px;
    font-weight: bold;
    line-height: 1.2;
}

/* CONTENT BOX */
.content {
    background: white;
    margin: -30px 15px 0;
    padding: 18px;
    border-radius: 20px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.1);
}

.content p {
    font-size: 18px;
    font-weight: 600;
    margin: 10px 0;
}

/* SUBBU IMAGE */
.subbu {
    width: 110px;
    margin: 10px auto;
}

/* SLOGAN */
.slogan {
    color: #ff5722;
    font-weight: bold;
    font-size: 18px;
    margin: 5px 0 10px;
}

/* BUTTON */
.btn {
    display: block;
    background: #1db954;
    color: white;
    padding: 16px;
    border-radius: 30px;
    font-size: 18px;
    text-decoration: none;
    margin-top: 10px;
}

</style>
</head>

<body>

<div class="hero">
    <img src="hero.jpg">
    <img src="logo.png" class="logo">

    <div class="hero-text">
        <h1>एसीएस-एआई<br>डिजिटल मास्टर</h1>
    </div>
</div>

<div class="content">

    <p>मोबाइल में सिर्फ रील देखने वाले,<br>
    अब समझेंगे, सीखेंगे, और बनाएंगे!</p>

    <p>फिर बनेंगे सोशल मीडिया का सुल्तान,<br>
    एक सच्चा डिजिटल मास्टर!</p>

    <img src="subbu.jpg" class="subbu">

    <div class="slogan">ए आई स्किल, सीखेगा इंडिया!</div>

    <a href="#" class="btn">👉 अभी शुरू करें</a>

</div>

</body>
</html>
