<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACS-AI DIGITAL MASTER</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f5f5f5;
        }

        .container {
            max-width: 400px;
            margin: auto;
            background: white;
            padding: 20px;
        }

        .logo {
            width: 120px;
            margin-top: 10px;
        }

        .hero {
            width: 100%;
            border-radius: 10px;
            margin-top: 15px;
        }

        h1 {
            font-size: 20px;
            margin-top: 15px;
        }

        p {
            font-size: 16px;
            color: #333;
        }

        .subbu {
            width: 120px;
            border-radius: 50%;
            margin-top: 15px;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            background: green;
            color: white;
            text-decoration: none;
            border-radius: 25px;
            margin-top: 20px;
            font-size: 16px;
        }

        .btn:hover {
            background: darkgreen;
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- Logo -->
        <img src="logo.png" class="logo">

        <!-- Hero Image -->
        <img src="hero.jpg" class="hero">

        <!-- Heading -->
        <h1>ACS-AI DIGITAL MASTER™</h1>

        <!-- Text -->
        <p>
            मोबाइल में सिर्फ रील देखने वाले,<br>
            अब समझेंगे, सीखेंगे, और बनाएंगे!<br><br>

            फिर बनेंगे सोशल मीडिया का सुल्तान,<br>
            एक सच्चा डिजिटल मास्टर!
        </p>

        <!-- Subbu Image -->
        <img src="subbu.jpg" class="subbu">

        <!-- Button -->
        <a href="#" class="btn">👉 अभी शुरू करें</a>

    </div>

</body>
</html>
