<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ACS-AI DIGITAL MASTER</title>

<style>
body{
    margin:0;
    font-family:sans-serif;
    background:#f5f7fa;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    height:100vh;
    text-align:center;
}

/* TOP (30%) */
.top{
    height:30%;
    background:linear-gradient(rgba(0,0,0,0.5),rgba(0,0,0,0.5)), url('herojpg');
    background-size:cover;
    background-position:center;
    display:flex;
    flex-direction:column;
    justify-content:center;
    color:white;
}

.title-en{
    font-size:18px;
    font-weight:bold;
}

.title-hi{
    font-size:26px;
    font-weight:bold;
}

/* MIDDLE (40-50%) */
.middle{
    padding:20px;
}

.message{
    font-size:22px;
    font-weight:bold;
    line-height:1.5;
}

.slogan{
    margin-top:20px;
    font-size:18px;
    color:#ff9800;
    font-weight:bold;
}

/* SUBBU IMAGE */
.subbu{
    margin-top:15px;
}

.subbu img{
    width:120px;
    border-radius:50%;
    box-shadow:0 5px 15px rgba(0,0,0,0.2);
}

/* BOTTOM (20-30%) */
.bottom{
    padding:20px;
}

.btn{
    background:#4CAF50;
    color:white;
    padding:18px;
    border-radius:40px;
    font-size:22px;
    text-decoration:none;
    display:block;
}
</style>
</head>

<body>

<div class="top">
    <div class="title-en">ACS-AI DIGITAL MASTER™</div>
    <div class="title-hi">ए.सी.एस.-ए.आई. डिजिटल मास्टर</div>
</div>

<div class="middle">
    <div class="message">
        मोबाइल में सिर्फ रील देखने वाले,<br>
        अब समझेंगे, सीखेंगे, और बनाएंगे!<br>
        फिर बनेंगे सोशल मीडिया का सुल्तान,<br>
        एक सच्चा डिजिटल मास्टर!
    </div>

    <div class="subbu">
        <img src="subbu.jpg">
    </div>

    <div class="slogan">
        ए आई स्किल, सीखेगा इंडिया!
    </div>
</div>

<div class="bottom">
    <a href="#" class="btn">तो चलो ...  शुरू करते हैं!</a>
</div>

</body>
</html>
