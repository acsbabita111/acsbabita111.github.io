<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ACS-AI DIGITAL MASTER</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
    font-family: Arial, sans-serif;
    background: linear-gradient(180deg,#f7f9ff,#eef4ff);
}

.page{
    max-width:430px;
    margin:auto;
    padding:8px 10px 6px;
}

/* HERO */
.hero-box{
    position:relative;
    height:30vh;
    min-height:210px;
    border-radius:22px;
    overflow:hidden;
}

.hero-img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.hero-overlay{
    position:absolute;
    inset:0;
    background:linear-gradient(to bottom,rgba(0,0,0,0.1),rgba(0,0,0,0.3));
}

.hero-logo{
    position:absolute;
    top:10px;
    left:10px;
    width:52px;
    height:52px;
    border-radius:50%;
    background:#fff;
    padding:4px;
}

.hero-title{
    position:absolute;
    bottom:10px;
    width:100%;
    text-align:center;
    color:#fff;
}

.title-en{
    font-size:12px;
    font-weight:700;
}

.title-hi{
    font-size:30px;
    font-weight:900;
}

/* CONTENT */
.content-box{
    background:#fff;
    margin-top:6px;
    border-radius:20px;
    padding:12px;
    text-align:center;
}

.main-text{
    font-size:22px;
    font-weight:800;
    line-height:1.5;
    margin-bottom:10px;
}

/* SUBBU */
.subbu{
    width:100px;
    height:100px;
    border-radius:50%;
    margin:8px auto;
}

/* TAGLINE */
.tagline{
    font-size:20px;
    font-weight:900;
    color:#ff5722;
    margin-bottom:10px;
}

/* BUTTON */
.btn{
    display:block;
    width:100%;
    background:linear-gradient(90deg,#16a34a,#22c55e);
    color:#fff;
    font-size:24px;
    font-weight:900;
    padding:16px;
    border-radius:20px;
    text-decoration:none;
}

.btn:active{
    transform:scale(0.97);
}
</style>
</head>

<body>

<div class="page">

    <!-- HERO -->
    <div class="hero-box">
        <img src="hero.jpg" class="hero-img">
        <div class="hero-overlay"></div>

        <img src="logo.png" class="hero-logo">

        <div class="hero-title">
            <div class="title-en">ACS-AI DIGITAL MASTER™</div>
            <div class="title-hi">एसीएस-एआई डिजिटल मास्टर</div>
        </div>
    </div>

    <!-- CONTENT -->
    <div class="content-box">

        <div class="main-text">
            मोबाइल में सिर्फ रील देखने वाले,<br>
            अब समझेंगे, सीखेंगे, और बनाएंगे!<br><br>
            फिर बनेंगे सोशल मीडिया का सुल्तान,<br>
            एक सच्चा डिजिटल मास्टर!
        </div>

        <img src="subbu.jpg" class="subbu">

        <div class="tagline">ए आई स्किल, सीखेगा इंडिया!</div>

        <a href="#" class="btn">👉 अभी शुरू करें</a>

    </div>

</div>

</body>
</html>
